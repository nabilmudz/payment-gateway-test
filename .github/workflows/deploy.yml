name: Deploy with Prisma to VPS

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: secrets

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install SSH and Rsync
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass rsync

    - name: Sync Files to VPS (exclude unnecessary stuff)
      run: |
        sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" rsync -avz --delete \
          --exclude='.env' \
          --exclude='logs/' \
          --exclude='public/' \
          --exclude='uploads/' \
          -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT_PROD }}" \
          ./ ${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }}:/home/${{ secrets.VPS_USER_PROD }}/staging/payment-gateway-test
    - name: Deploy with Docker
      run: |
        sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT_PROD }} ${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }} << 'EOF'
        cd /home/${{ secrets.VPS_USER_PROD }}/staging/payment-gateway-test

        # Make sure Docker is installed
        if ! command -v docker &> /dev/null
        then
            echo "Docker not found. Installing..."
            curl -fsSL https://get.docker.com -o get-docker.sh
            sh get-docker.sh
        fi

        # Check docker compose plugin
        if ! docker compose version &> /dev/null
        then
            echo "Docker Compose plugin missing. Installing..."
            sudo apt-get install -y docker-compose-plugin
        fi

        echo "=== Rebuilding container ==="
        docker compose down --remove-orphans
        docker compose build
        docker compose up -d

        echo "=== Waiting for backend to be ready ==="
        sleep 10

        echo "=== Running Prisma migration ==="
        docker compose exec -T backend npx prisma migrate deploy || (
            echo "Migration failed, checking logs..."
            docker compose logs backend
            exit 1
        )

        echo "=== Deployment completed ==="
        EOF

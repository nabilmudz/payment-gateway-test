name: Deploy with Prisma to VPS

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: secrets

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Install SSH and SSHPass
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass openssh-client rsync

    - name: Debug secrets and connection info
      run: |
        echo "=== Debugging Secrets ==="
        echo "VPS_HOST_PROD: [${{ secrets.VPS_HOST_PROD }}]"
        echo "VPS_USER_PROD: [${{ secrets.VPS_USER_PROD }}]"
        echo "VPS_PORT_PROD: [${{ secrets.VPS_PORT_PROD }}]"
        echo "VPS_PASSWORD_PROD: [hidden intentionally]"

    - name: Sync Files to VPS (exclude .env and necessary folder)
      run: |
        sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" rsync -avz --delete \
          --exclude='.env' \
          --exclude='logs/' \
          --exclude='public/' \
          --exclude='uploads/' \
          -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT_PROD }}" \
          ./ ${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }}:/home/${{ secrets.VPS_USER_PROD }}/staging/payment-gateway-test

    - name: Install Dependencies and Run Prisma Migrations
      run: |
        sshpass -p "${{ secrets.VPS_PASSWORD_PROD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT_PROD }} ${{ secrets.VPS_USER_PROD }}@${{ secrets.VPS_HOST_PROD }} << 'EOF'
          # Set the Node.js version to 20.x if it's not already set
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # Load NVM
          nvm install 20
          nvm use 20

          # Verify Node.js version
          node -v

          # Install PM2 if not already installed
          npm install -g pm2

          # Go to the app directory
          cd /home/${{ secrets.VPS_USER_PROD }}/staging/payment-gateway-test

          # Install dependencies
          npm install

          # Run Prisma Migrations
          npx prisma migrate dev

        EOF
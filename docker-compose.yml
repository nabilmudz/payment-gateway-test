services:
  backend:
    build: .
    container_name: payment-gateway-api
    restart: always
    env_file: .env
    ports:
      - "8001:8001"
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    networks:
      - myapp_net

networks:
  myapp_net:
    driver: bridge
